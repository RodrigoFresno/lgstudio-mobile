name: Verificar compilação do lgStudio
# Executa novamente após os ajustes de transparência e interface.

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/exportacao-transparente-ptbr]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Compilar aplicativo
        run: npm run build
